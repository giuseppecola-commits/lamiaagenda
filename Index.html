<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eddf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="La Mia Agenda">
<title>La Mia Agenda</title>
<style>
:root{
 --paper:#f7f0e3;--paper2:#fbf7ef;--ink:#3c342b;--muted:#8d7e6d;--line:#ddd1bd;
 --red:#a9362d;--gold:#b38b55;--shadow:0 12px 30px rgba(70,48,25,.12);
}
*{box-sizing:border-box}
body{margin:0;background:#e9dfcf;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{min-height:100vh;max-width:900px;margin:auto;padding:env(safe-area-inset-top) 0 calc(18px + env(safe-area-inset-bottom));background:var(--paper)}
.top{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;padding:18px 18px 4px}
.icon{border:0;background:transparent;color:var(--ink);font-size:28px;width:48px;height:48px;border-radius:50%}
.icon:active{background:#e8ddcb}
.heading{text-align:center}.weekday{font-size:16px;color:var(--red);margin-bottom:2px}.bigdate{font-size:54px;line-height:.95}.month{font-size:17px;margin-top:5px}
.divider{height:1px;background:var(--line);margin:12px 22px}
.month-mini{margin:0 24px 10px;display:grid;grid-template-columns:1fr 1.35fr;gap:16px;align-items:center}
.mini-title{font-size:12px;text-align:center;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px}.mini b{color:var(--muted);font-weight:normal}
.mini span{padding:4px 0;border-radius:50%}.mini .today{background:var(--red);color:white}
.quote{font-style:italic;text-align:center;font-size:14px;line-height:1.35;color:#665a4d;padding:0 10px}
.agenda{margin:0 18px;background:var(--paper2);box-shadow:var(--shadow);border-radius:4px;overflow:hidden;border:1px solid #e3d7c4}
.slot{display:grid;grid-template-columns:57px 1fr;min-height:47px;border-bottom:1px dashed var(--line)}
.time{font-size:12px;padding:9px 7px 0 0;text-align:right;color:#6d6255}.time.hour{color:var(--red);font-size:13px}
.cell{border-left:1px solid var(--line);padding:4px 7px;min-height:47px;position:relative}
.cell:active{background:#f2e8d7}
.event{min-height:36px;border-radius:4px;padding:6px 9px;margin:0 0 3px;display:flex;align-items:center;gap:7px;font-size:14px;box-shadow:0 1px 2px #0001}
.event .dot{width:7px;height:7px;border-radius:50%;flex:none}.event .txt{flex:1}.event .del{border:0;background:transparent;color:#665a4d;font-size:17px;padding:0 3px}
.blue{background:#d9e1e7}.blue .dot{background:#5b7890}.green{background:#dfe6c9}.green .dot{background:#6d873e}.yellow{background:#f4dfad}.yellow .dot{background:#b38325}.rose{background:#efd1cb}.rose .dot{background:#b55a4e}.purple{background:#dfd2e6}.purple .dot{background:#86649a}.orange{background:#ead3b7}.orange .dot{background:#b87532}
.bottomnav{position:sticky;bottom:0;margin:14px 18px 0;background:rgba(247,240,227,.96);backdrop-filter:blur(12px);border:1px solid #ded1be;border-radius:18px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 8px 24px #0002;z-index:4}
.bottomnav button{border:0;background:transparent;color:var(--ink);padding:10px 4px;font-size:12px}.bottomnav .sym{display:block;font-size:20px;line-height:22px}.add{background:#9b7b4d!important;color:white!important;border-radius:50%!important;width:46px;height:46px;margin:-10px auto 0;box-shadow:0 4px 10px #0003}
.notes{margin:14px 18px;background:var(--paper2);border:1px solid #e3d7c4;padding:13px 16px;box-shadow:var(--shadow)}
.notes label{font-size:11px;letter-spacing:1.5px;color:var(--muted)}.notes textarea{display:block;width:100%;height:80px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);line-height:1.5;margin-top:5px}
.modal{display:none;position:fixed;inset:0;background:#2c2118aa;z-index:20;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}
.card{width:min(620px,100%);max-height:90vh;overflow:auto;background:var(--paper2);border-radius:20px 20px 8px 8px;padding:20px;box-shadow:0 -5px 40px #0005}.card h2{margin:0 0 16px;font-size:24px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fffaf2;color:var(--ink);border-radius:10px;padding:11px}.field textarea{height:80px;resize:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:15px}.actions button{border:0;border-radius:11px;padding:11px 17px}.primary{background:#9b7b4d;color:white}.secondary{background:#e6dccb;color:var(--ink)}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.menu button{border:1px solid var(--line);background:#f4ead9;border-radius:12px;padding:14px;text-align:left;color:var(--ink)}
.list{margin-top:10px}.item{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.item input{width:19px;height:19px}.muted{color:var(--muted);font-size:13px}
.dark{--paper:#282521;--paper2:#312e29;--ink:#f1eadf;--muted:#b8aa98;--line:#4b443a;--shadow:0 12px 30px #0005}
body.dark{background:#171513}.dark .bottomnav{background:#282521ee}.dark .field input,.dark .field textarea,.dark .field select{background:#3a352e;color:var(--ink)}
@media(max-width:600px){.month-mini{grid-template-columns:1fr 1.2fr}.quote{font-size:13px}.agenda{margin:0 10px}.notes{margin:12px 10px}.bottomnav{margin-left:10px;margin-right:10px}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon" onclick="openMenu()" aria-label="Menu">☰</button>
    <div class="heading"><div class="weekday" id="weekday"></div><div class="bigdate" id="bigdate"></div><div class="month" id="month"></div></div>
    <button class="icon" onclick="openCalendar()" aria-label="Calendario">▦</button>
  </header>
  <div class="divider"></div>
  <section class="month-mini">
    <div><div class="mini-title" id="miniTitle"></div><div class="mini" id="mini"></div></div>
    <div class="quote">“Il segreto per andare avanti è iniziare.”<br><span class="muted">Mark Twain</span></div>
  </section>
  <main class="agenda" id="agenda"></main>
  <section class="notes"><label>NOTE DEL GIORNO</label><textarea id="notes" placeholder="Scrivi liberamente..."></textarea></section>
  <nav class="bottomnav">
    <button onclick="toggleDonePanel()"><span class="sym">☑</span>Attività</button>
    <button onclick="openNotes()"><span class="sym">✎</span>Note</button>
    <button class="add" onclick="openEvent(6)"><span class="sym">＋</span></button>
    <button onclick="openSearch()"><span class="sym">⌕</span>Cerca</button>
    <button onclick="openSettings()"><span class="sym">•••</span>Altro</button>
  </nav>
</div>

<div class="modal" id="eventModal"><div class="card">
<h2>Aggiungi evento</h2>
<div class="field"><label>Titolo</label><input id="title" placeholder="Es. Palestra"></div>
<div class="row"><div class="field"><label>Inizio</label><select id="hour"></select></div><div class="field"><label>Colore</label><select id="color"><option value="blue">Blu</option><option value="green">Verde</option><option value="yellow">Giallo</option><option value="rose">Rosa</option><option value="purple">Viola</option><option value="orange">Arancio</option></select></div></div>
<div class="field"><label>Nota</label><textarea id="details" placeholder="Dettagli..."></textarea></div>
<div class="row"><div class="field"><label>Promemoria</label><select id="reminder"><option>Nessuno</option><option>5 minuti prima</option><option>15 minuti prima</option><option>30 minuti prima</option><option>1 ora prima</option></select></div><div class="field"><label>Ripeti</label><select id="repeat"><option>Mai</option><option>Ogni giorno</option><option>Ogni settimana</option></select></div></div>
<div class="actions"><button class="secondary" onclick="closeModal('eventModal')">Annulla</button><button class="primary" onclick="saveEvent()">Salva</button></div>
</div></div>

<div class="modal" id="calendarModal"><div class="card"><h2>Calendario mensile</h2><div id="calendarGrid" class="mini" style="font-size:14px;gap:5px"></div><div class="actions"><button class="secondary" onclick="closeModal('calendarModal')">Chiudi</button></div></div></div>
<div class="modal" id="menuModal"><div class="card"><h2>La Mia Agenda</h2><div class="menu">
<button onclick="closeModal('menuModal');goToday()">📖 Agenda giornaliera</button><button onclick="closeModal('menuModal');openCalendar()">▦ Calendario mensile</button>
<button onclick="closeModal('menuModal');openTasks()">☑ Promemoria</button><button onclick="closeModal('menuModal');openSettings()">⚙ Impostazioni</button>
</div><div class="actions"><button class="secondary" onclick="closeModal('menuModal')">Chiudi</button></div></div></div>
<div class="modal" id="searchModal"><div class="card"><h2>Cerca</h2><div class="field"><input id="search" placeholder="Cerca titolo o nota..." oninput="doSearch()"></div><div id="results"></div><div class="actions"><button class="secondary" onclick="closeModal('searchModal')">Chiudi</button></div></div></div>
<div class="modal" id="tasksModal"><div class="card"><h2>Promemoria</h2><div id="tasks"></div><div class="actions"><button class="secondary" onclick="closeModal('tasksModal')">Chiudi</button></div></div></div>
<div class="modal" id="settingsModal"><div class="card"><h2>Impostazioni</h2><div class="menu">
<button onclick="toggleDark()">🌙 Modalità scura</button><button onclick="exportData()">☁ Esporta dati</button>
<button onclick="clearData()">♻ Cancella dati</button><button onclick="alert('La Mia Agenda\\nAgenda giornaliera 06:00–23:00\\nDati salvati localmente sul dispositivo.')">ⓘ Informazioni</button>
</div><p class="muted">I tuoi appuntamenti e le note restano salvati nel browser di questo dispositivo.</p><div class="actions"><button class="secondary" onclick="closeModal('settingsModal')">Fine</button></div></div></div>

<script>
let selectedDate=new Date(), selectedHour=6;
let events=JSON.parse(localStorage.getItem('agendaEvents')||'{}');
const days=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const months=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(){
 const k=key(selectedDate);
 document.getElementById('weekday').textContent=days[selectedDate.getDay()];
 document.getElementById('bigdate').textContent=selectedDate.getDate();
 document.getElementById('month').textContent=`${months[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;
 renderMini();
 let html='';
 for(let h=6;h<=23;h++){
  const arr=(events[k]||[]).filter(x=>x.hour===h);
  html+=`<div class="slot"><div class="time ${h%1===0?'hour':''}">${String(h).padStart(2,'0')}:00</div><div class="cell" onclick="openEvent(${h})">`;
  arr.forEach(x=>html+=`<div class="event ${x.color}" onclick="event.stopPropagation();deleteEvent('${esc(x.id)}')"><span class="dot"></span><span class="txt"><b>${esc(x.title)}</b>${x.details?`<small class="muted"> — ${esc(x.details)}</small>`:''}</span><button class="del" aria-label="Elimina">×</button></div>`);
  html+='</div></div>';
 }
 document.getElementById('agenda').innerHTML=html;
 const n=document.getElementById('notes'); n.value=localStorage.getItem('notes_'+k)||''; n.oninput=e=>localStorage.setItem('notes_'+k,e.target.value);
}
function renderMini(){
 const y=selectedDate.getFullYear(),m=selectedDate.getMonth(), first=new Date(y,m,1).getDay(), daysIn=new Date(y,m+1,0).getDate();
 document.getElementById('miniTitle').textContent=`${months[m]} ${y}`;
 let h='<b>L</b><b>M</b><b>M</b><b>G</b><b>V</b><b>S</b><b>D</b>';
 let offset=(first+6)%7;
 for(let i=0;i<offset;i++)h+='<span></span>';
 for(let d=1;d<=daysIn;d++){let c=d===selectedDate.getDate()?'today':'';h+=`<span class="${c}" onclick="selectDay(${d})">${d}</span>`}
 document.getElementById('mini').innerHTML=h;
}
function selectDay(d){selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),d);render()}
function goToday(){selectedDate=new Date();render()}
function changeDay(n){selectedDate.setDate(selectedDate.getDate()+n);render()}
function openEvent(h){selectedHour=h;const sel=document.getElementById('hour');sel.innerHTML='';for(let i=6;i<=23;i++)sel.innerHTML+=`<option value="${i}" ${i===h?'selected':''}>${String(i).padStart(2,'0')}:00</option>`;document.getElementById('title').value='';document.getElementById('details').value='';document.getElementById('eventModal').classList.add('show');setTimeout(()=>document.getElementById('title').focus(),50)}
function saveEvent(){
 const title=document.getElementById('title').value.trim(); if(!title)return;
 const k=key(selectedDate), obj={id:Date.now().toString(),hour:Number(document.getElementById('hour').value),title,details:document.getElementById('details').value.trim(),color:document.getElementById('color').value,reminder:document.getElementById('reminder').value,repeat:document.getElementById('repeat').value};
 (events[k]||(events[k]=[])).push(obj);localStorage.setItem('agendaEvents',JSON.stringify(events));closeModal('eventModal');render();
}
function deleteEvent(id){const k=key(selectedDate);events[k]=(events[k]||[]).filter(x=>x.id!==id);localStorage.setItem('agendaEvents',JSON.stringify(events));render()}
function closeModal(id){document.getElementById(id).classList.remove('show')}
function openCalendar(){renderCalendar();document.getElementById('calendarModal').classList.add('show')}
function renderCalendar(){
 const y=selectedDate.getFullYear(),m=selectedDate.getMonth(),first=(new Date(y,m,1).getDay()+6)%7, total=new Date(y,m+1,0).getDate();
 let h='<b>L</b><b>M</b><b>M</b><b>G</b><b>V</b><b>S</b><b>D</b>';for(let i=0;i<first;i++)h+='<span></span>';
 for(let d=1;d<=total;d++){let date=new Date(y,m,d), k=key(date), has=(events[k]||[]).length?' style="font-weight:bold;text-decoration:underline"':'';let c=d===selectedDate.getDate()?'today':'';h+=`<span class="${c}"${has} onclick="selectFromCalendar(${d})">${d}</span>`}
 document.getElementById('calendarGrid').innerHTML=h;
}
function selectFromCalendar(d){selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),d);closeModal('calendarModal');render()}
function openMenu(){document.getElementById('menuModal').classList.add('show')}
function openSearch(){document.getElementById('searchModal').classList.add('show');document.getElementById('search').value='';doSearch();setTimeout(()=>document.getElementById('search').focus(),50)}
function doSearch(){const q=(document.getElementById('search')?.value||'').toLowerCase();let out=[];Object.entries(events).forEach(([d,arr])=>arr.forEach(x=>{if(!q||x.title.toLowerCase().includes(q)||(x.details||'').toLowerCase().includes(q))out.push(`<div class="item"><span>📌</span><span><b>${esc(d)} · ${String(x.hour).padStart(2,'0')}:00</b><br>${esc(x.title)}</span></div>`)}));document.getElementById('results').innerHTML=out.length?out.slice(0,50).join(''):'<p class="muted">Nessun risultato.</p>'}
function openTasks(){let out=[];Object.entries(events).forEach(([d,arr])=>arr.forEach(x=>{if(x.reminder!=='Nessuno')out.push(`<div class="item"><input type="checkbox"><span><b>${esc(x.title)}</b><br><span class="muted">${d} · ${String(x.hour).padStart(2,'0')}:00 · ${esc(x.reminder)}</span></span></div>`)}));document.getElementById('tasks').innerHTML=out.length?out.join(''):'<p class="muted">Nessun promemoria impostato.</p>';document.getElementById('tasksModal').classList.add('show')}
function toggleDonePanel(){openTasks()}
function openNotes(){document.getElementById('notes').scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>document.getElementById('notes').focus(),350)}
function openSettings(){document.getElementById('settingsModal').classList.add('show')}
function toggleDark(){document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark')?'1':'0')}
function exportData(){const data={events,notes:{}};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith('notes_'))data.notes[k]=localStorage.getItem(k)}const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='la-mia-agenda-backup.json';a.click();URL.revokeObjectURL(a.href)}
function clearData(){if(confirm('Cancellare tutti gli appuntamenti e le note da questo dispositivo?')){localStorage.clear();events={};location.reload()}}
document.body.classList.toggle('dark',localStorage.getItem('dark')==='1');
render();
</script>
</body>
</html>
