<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4eddf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Mia Agenda">
<title>La Mia Agenda</title>
<style>
:root{--paper:#f7f0e3;--paper2:#fbf7ef;--ink:#3c342b;--muted:#8d7e6d;--line:#ddd1bd;--red:#a9362d;--gold:#9b7b4d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e9dfcf;color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}
#app{min-height:100vh;max-width:900px;margin:auto;background:var(--paper);padding:env(safe-area-inset-top) 0 calc(18px + env(safe-area-inset-bottom))}
.top{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;padding:14px}.icon{border:0;background:transparent;font-size:27px;width:48px;height:48px;border-radius:50%}.heading{text-align:center}.weekday{font-size:16px;color:var(--red)}.bigdate{font-size:54px;line-height:.95}.month{font-size:17px;margin-top:5px}.divider{height:1px;background:var(--line);margin:4px 20px 10px}
.page-nav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:0 14px 8px}.page-nav button{border:1px solid var(--line);background:#efe4d2;border-radius:11px;min-height:40px}.page-nav .label{text-align:center;font-size:14px}.page-nav .today{min-height:25px;font-size:11px;padding:2px 9px}
.month-mini{margin:0 22px 10px;display:grid;grid-template-columns:1fr 1.35fr;gap:14px;align-items:center}.mini-title{font-size:12px;text-align:center;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:11px}.mini b{color:var(--muted);font-weight:normal}.mini span{padding:4px 0;border-radius:50%;cursor:pointer}.mini .today{background:var(--red);color:#fff}.mini .has{box-shadow:inset 0 -3px 0 var(--gold)}
.quote{font-style:italic;text-align:center;font-size:14px;line-height:1.35;color:#665a4d}
.agenda{margin:0 14px;background:var(--paper2);border:1px solid #e3d7c4;border-radius:5px;overflow:hidden}.slot{display:grid;grid-template-columns:58px 1fr;min-height:34px;border-bottom:1px dashed var(--line)}.time{font-size:11px;padding:7px 7px 0 0;text-align:right;color:#6d6255}.time.hour{color:var(--red);font-size:12px;font-weight:bold}.cell{border-left:1px solid var(--line);padding:2px 6px;min-height:34px}
.event{min-height:29px;border-radius:4px;padding:4px 7px;margin-bottom:2px;display:flex;align-items:center;gap:6px;font-size:13px}.event .dot{width:7px;height:7px;border-radius:50%}.event .txt{flex:1}.event .del{border:0;background:transparent;font-size:16px}
.blue{background:#d9e1e7}.blue .dot{background:#5b7890}.green{background:#dfe6c9}.green .dot{background:#6d873e}.yellow{background:#f4dfad}.yellow .dot{background:#b38325}.rose{background:#efd1cb}.rose .dot{background:#b55a4e}.purple{background:#dfd2e6}.purple .dot{background:#86649a}.orange{background:#ead3b7}.orange .dot{background:#b87532}
.notes{margin:12px 14px;background:var(--paper2);border:1px solid #e3d7c4;padding:12px 15px}.notes label{font-size:11px;letter-spacing:1.5px;color:var(--muted)}.notes textarea{display:block;width:100%;height:76px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);margin-top:5px}
.bottomnav{position:sticky;bottom:0;margin:12px 14px 0;background:#f7f0e3ee;backdrop-filter:blur(12px);border:1px solid #ded1be;border-radius:18px;display:grid;grid-template-columns:repeat(5,1fr);box-shadow:0 8px 24px #0002;z-index:4}.bottomnav button{border:0;background:transparent;padding:9px 3px;font-size:11px}.sym{display:block;font-size:20px;line-height:22px}.add{background:#9b7b4d!important;color:#fff!important;border-radius:50%!important;width:46px;height:46px;margin:-10px auto 0}
.modal{display:none;position:fixed;inset:0;background:#2c2118aa;z-index:20;align-items:flex-end;justify-content:center;padding:10px}.modal.show{display:flex}.card{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--paper2);border-radius:20px 20px 8px 8px;padding:19px}.card h2{margin:0 0 15px;font-size:23px}.field{margin:9px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#fffaf2;color:var(--ink);border-radius:10px;padding:10px}.field textarea{height:76px;resize:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:14px}.actions button{border:0;border-radius:11px;padding:10px 15px}.primary{background:#9b7b4d;color:#fff}.secondary{background:#e6dccb}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.menu button{border:1px solid var(--line);background:#f4ead9;border-radius:12px;padding:13px;text-align:left}.muted{color:var(--muted);font-size:13px}
.calendar-head{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-bottom:12px}.calendar-head button{border:1px solid var(--line);background:#efe4d2;border-radius:10px;min-height:38px}.calendar-title{text-align:center;font-size:18px}.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.calendar-grid b{font-size:11px;color:var(--muted);padding:5px}.calendar-grid span{padding:8px 2px;border-radius:50%;cursor:pointer}.calendar-grid span.today{background:var(--red);color:#fff}.calendar-grid span.has{box-shadow:inset 0 -3px 0 var(--gold)}
.year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.year-month{border:1px solid var(--line);background:#f7efe2;border-radius:10px;padding:8px}.year-month h3{text-align:center;font-size:13px;margin:3px 0 6px}.year-month .mini{font-size:9px;gap:1px}.year-month .mini span{padding:3px 0}.view-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}.view-switch button{border:1px solid var(--line);background:#efe4d2;border-radius:10px;padding:9px}.view-switch .active{background:#9b7b4d;color:#fff}
.dark{--paper:#282521;--paper2:#312e29;--ink:#f1eadf;--muted:#b8aa98;--line:#4b443a}.dark .bottomnav{background:#282521ee}.dark .field input,.dark .field textarea,.dark .field select,.dark .menu button,.dark .calendar-head button,.dark .view-switch button,.dark .page-nav button{background:#3a352e;color:var(--ink)}
@media(max-width:600px){.month-mini{grid-template-columns:1fr 1.2fr}.quote{font-size:13px}.year-grid{grid-template-columns:repeat(2,1fr)}.agenda{margin:0 8px}.notes{margin:11px 8px}.bottomnav{margin-left:8px;margin-right:8px}}
</style>
</head>
<body><div id="app">
<header class="top"><button class="icon" onclick="openMenu()">☰</button><div class="heading"><div class="weekday" id="weekday"></div><div class="bigdate" id="bigdate"></div><div class="month" id="month"></div></div><button class="icon" onclick="openCalendar()">▦</button></header>
<div class="divider"></div>
<div class="page-nav"><button onclick="prevDay()">‹</button><div class="label"><b>Agenda giornaliera</b><br><button class="today" onclick="goToday()">Oggi</button></div><button onclick="nextDay()">›</button></div>
<section class="month-mini"><div><div class="mini-title" id="miniTitle"></div><div class="mini" id="mini"></div></div><div class="quote">“Il segreto per andare avanti è iniziare.”<br><span class="muted">Mark Twain</span></div></section>
<main class="agenda" id="agenda"></main>
<section class="notes"><label>NOTE DEL GIORNO</label><textarea id="notes" placeholder="Scrivi liberamente..."></textarea></section>
<nav class="bottomnav"><button onclick="openTasks()"><span class="sym">☑</span>Attività</button><button onclick="openNotes()"><span class="sym">✎</span>Note</button><button class="add" onclick="openEvent()"><span class="sym">＋</span></button><button onclick="openSearch()"><span class="sym">⌕</span>Cerca</button><button onclick="openMenu()"><span class="sym">•••</span>Altro</button></nav>
</div>

<div class="modal" id="eventModal"><div class="card"><h2>Aggiungi evento</h2>
<div class="field"><label>Titolo</label><input id="title" placeholder="Es. Palestra"></div>
<div class="row"><div class="field"><label>Inizio</label><select id="timeSelect"></select></div><div class="field"><label>Colore</label><select id="color"><option value="blue">Blu</option><option value="green">Verde</option><option value="yellow">Giallo</option><option value="rose">Rosa</option><option value="purple">Viola</option><option value="orange">Arancio</option></select></div></div>
<div class="field"><label>Nota</label><textarea id="details" placeholder="Dettagli..."></textarea></div>
<div class="row"><div class="field"><label>Promemoria</label><select id="reminder"><option>Nessuno</option><option>5 minuti prima</option><option>15 minuti prima</option><option>30 minuti prima</option><option>1 ora prima</option></select></div><div class="field"><label>Ripeti</label><select id="repeat"><option>Mai</option><option>Ogni giorno</option><option>Ogni settimana</option></select></div></div>
<div class="actions"><button class="secondary" onclick="closeModal('eventModal')">Annulla</button><button class="primary" onclick="saveEvent()">Salva</button></div></div></div>

<div class="modal" id="calendarModal"><div class="card"><div class="view-switch"><button id="monthBtn" class="active" onclick="setCalendarView('month')">Calendario mensile</button><button id="yearBtn" onclick="setCalendarView('year')">Vista annuale</button></div><div id="calendarContent"></div><div class="actions"><button class="secondary" onclick="closeModal('calendarModal')">Chiudi</button></div></div></div>

<div class="modal" id="menuModal"><div class="card"><h2>La Mia Agenda</h2><div class="menu">
<button onclick="closeModal('menuModal');goToday()">📖 Agenda giornaliera</button><button onclick="closeModal('menuModal');openCalendar()">▦ Calendario</button><button onclick="closeModal('menuModal');openTasks()">☑ Promemoria</button><button onclick="closeModal('menuModal');openSettings()">⚙ Impostazioni</button>
</div><div class="actions"><button class="secondary" onclick="closeModal('menuModal')">Chiudi</button></div></div></div>

<div class="modal" id="searchModal"><div class="card"><h2>Cerca</h2><div class="field"><input id="search" placeholder="Cerca titolo o nota..." oninput="doSearch()"></div><div id="results"></div><div class="actions"><button class="secondary" onclick="closeModal('searchModal')">Chiudi</button></div></div></div>
<div class="modal" id="tasksModal"><div class="card"><h2>Promemoria</h2><div id="tasks"></div><div class="actions"><button class="secondary" onclick="closeModal('tasksModal')">Chiudi</button></div></div></div>
<div class="modal" id="settingsModal"><div class="card"><h2>Impostazioni</h2>
<div class="field"><label>Intervallo agenda</label><select id="intervalSelect" onchange="setIntervalMinutes(this.value)"><option value="60">Ogni ora</option><option value="30">Ogni 30 minuti</option><option value="15">Ogni 15 minuti</option></select></div>
<div class="menu"><button onclick="toggleDark()">🌙 Modalità scura</button><button onclick="exportData()">☁ Esporta dati</button><button onclick="clearData()">♻ Cancella dati</button><button onclick="alert('La Mia Agenda\\nAgenda giornaliera 06:00–23:00\\nIntervalli: 15, 30 o 60 minuti')">ⓘ Informazioni</button></div>
<p class="muted">Scegli ogni ora, ogni mezz’ora oppure ogni quarto d’ora.</p><div class="actions"><button class="secondary" onclick="closeModal('settingsModal')">Fine</button></div></div></div>

<script>
let selectedDate=new Date(),calendarView="month",events=JSON.parse(localStorage.getItem("agendaEvents")||"{}"),intervalMinutes=Number(localStorage.getItem("agendaInterval")||30);
const days=["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"],months=["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const fmt=m=>`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;

function normalize(){for(const k in events)(events[k]||[]).forEach(x=>{if(x.minute==null)x.minute=Number(x.hour||6)*60;x.minute=Number(x.minute);x.hour=Math.floor(x.minute/60)});localStorage.setItem("agendaEvents",JSON.stringify(events))}
function render(){normalize();const k=key(selectedDate);weekday.textContent=days[selectedDate.getDay()];bigdate.textContent=selectedDate.getDate();month.textContent=`${months[selectedDate.getMonth()]} ${selectedDate.getFullYear()}`;renderMini();let h="";for(let m=360;m<=1380;m+=intervalMinutes){const a=(events[k]||[]).filter(x=>Number(x.minute)===m);h+=`<div class="slot"><div class="time ${m%60===0?"hour":""}">${fmt(m)}</div><div class="cell" onclick="openEvent(${m})">`;a.forEach(x=>h+=`<div class="event ${x.color||"blue"}" onclick="event.stopPropagation();deleteEvent('${esc(x.id)}')"><span class="dot"></span><span class="txt"><b>${esc(x.title)}</b>${x.details?`<small class="muted"> — ${esc(x.details)}</small>`:""}</span><button class="del">×</button></div>`);h+="</div></div>"}agenda.innerHTML=h;notes.value=localStorage.getItem("notes_"+k)||"";notes.oninput=e=>localStorage.setItem("notes_"+k,e.target.value)}
function renderMini(){const y=selectedDate.getFullYear(),m=selectedDate.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();miniTitle.textContent=`${months[m]} ${y}`;let h="<b>L</b><b>M</b><b>M</b><b>G</b><b>V</b><b>S</b><b>D</b>";for(let i=0;i<(first+6)%7;i++)h+="<span></span>";for(let d=1;d<=n;d++){const k=key(new Date(y,m,d));h+=`<span class="${d===selectedDate.getDate()?"today ":""}${(events[k]||[]).length?"has":""}" onclick="selectDay(${d})">${d}</span>`}mini.innerHTML=h}
function selectDay(d){selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),d);render()}
function prevDay(){selectedDate.setDate(selectedDate.getDate()-1);render()}function nextDay(){selectedDate.setDate(selectedDate.getDate()+1);render()}function goToday(){selectedDate=new Date();render()}
function openModal(id){document.getElementById(id).classList.add("show")}function closeModal(id){document.getElementById(id).classList.remove("show")}function openMenu(){openModal("menuModal")}
function fillTimes(){timeSelect.innerHTML="";for(let m=360;m<=1380;m+=15){const o=document.createElement("option");o.value=m;o.textContent=fmt(m);timeSelect.appendChild(o)}}
function openEvent(m=360){fillTimes();timeSelect.value=String(m);title.value="";details.value="";color.value="blue";reminder.value="Nessuno";repeat.value="Mai";openModal("eventModal")}
function saveEvent(){const t=title.value.trim();if(!t)return alert("Inserisci un titolo.");const m=Number(timeSelect.value),k=key(selectedDate);events[k]=events[k]||[];events[k].push({id:String(Date.now()),title:t,minute:m,hour:Math.floor(m/60),color:color.value,details:details.value.trim(),reminder:reminder.value,repeat:repeat.value});localStorage.setItem("agendaEvents",JSON.stringify(events));closeModal("eventModal");render()}
function deleteEvent(id){const k=key(selectedDate);events[k]=(events[k]||[]).filter(x=>String(x.id)!==String(id));localStorage.setItem("agendaEvents",JSON.stringify(events));render()}

function openCalendar(){calendarView="month";renderCalendar();openModal("calendarModal")}
function setCalendarView(v){calendarView=v;monthBtn.classList.toggle("active",v==="month");yearBtn.classList.toggle("active",v==="year");renderCalendar()}
function renderCalendar(){if(calendarView==="year"){renderYear(calendarContent);return}const y=selectedDate.getFullYear(),m=selectedDate.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let h=`<div class="calendar-head"><button onclick="changeMonth(-1)">‹</button><div class="calendar-title">${months[m]} ${y}</div><button onclick="changeMonth(1)">›</button></div><div class="calendar-grid"><b>L</b><b>M</b><b>M</b><b>G</b><b>V</b><b>S</b><b>D</b>`;for(let i=0;i<(first+6)%7;i++)h+="<span></span>";for(let d=1;d<=n;d++){const k=key(new Date(y,m,d));h+=`<span class="${d===selectedDate.getDate()?"today ":""}${(events[k]||[]).length?"has":""}" onclick="pickDay(${d})">${d}</span>`}calendarContent.innerHTML=h+"</div>"}
function changeMonth(d){selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth()+d,1);render();renderCalendar()}function pickDay(d){selectedDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),d);closeModal("calendarModal");render()}
function renderYear(box){const y=selectedDate.getFullYear();let h=`<div class="calendar-head"><button onclick="changeYear(-1)">‹</button><div class="calendar-title">${y}</div><button onclick="changeYear(1)">›</button></div><div class="year-grid">`;for(let m=0;m<12;m++){const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();h+=`<div class="year-month"><h3>${months[m]}</h3><div class="mini"><b>L</b><b>M</b><b>M</b><b>G</b><b>V</b><b>S</b><b>D</b>`;for(let i=0;i<(first+6)%7;i++)h+="<span></span>";for(let d=1;d<=n;d++){const k=key(new Date(y,m,d));h+=`<span class="${m===selectedDate.getMonth()&&d===selectedDate.getDate()?"today ":""}${(events[k]||[]).length?"has":""}" onclick="pickYearDay(${m},${d})">${d}</span>`}h+="</div></div>"}box.innerHTML=h+"</div>"}
function changeYear(d){selectedDate=new Date(selectedDate.getFullYear()+d,selectedDate.getMonth(),1);render();renderCalendar()}function pickYearDay(m,d){selectedDate=new Date(selectedDate.getFullYear(),m,d);closeModal("calendarModal");render()}

function openNotes(){notes.focus();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
function openTasks(){let a=[];for(const k in events)(events[k]||[]).forEach(x=>{if(x.reminder&&x.reminder!=="Nessuno")a.push(`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(x.title)}</b><br><span class="muted">${k} · ${fmt(x.minute)} · ${esc(x.reminder)}</span></div>`)});tasks.innerHTML=a.length?a.join(""):"<p class=\"muted\">Nessun promemoria.</p>";openModal("tasksModal")}
function openSearch(){search.value="";results.innerHTML="";openModal("searchModal")}
function doSearch(){const q=search.value.toLowerCase().trim(),a=[];for(const k in events)(events[k]||[]).forEach(x=>{if(!q||(x.title+" "+(x.details||"")).toLowerCase().includes(q))a.push(`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(x.title)}</b><br><span class="muted">${k} · ${fmt(x.minute)}</span></div>`)});results.innerHTML=a.length?a.join(""):"<p class=\"muted\">Nessun risultato.</p>"}
function openSettings(){intervalSelect.value=String(intervalMinutes);openModal("settingsModal")}function setIntervalMinutes(v){intervalMinutes=Number(v);localStorage.setItem("agendaInterval",String(intervalMinutes));render()}
function toggleDark(){document.body.classList.toggle("dark");localStorage.setItem("agendaDark",document.body.classList.contains("dark")?"1":"0")}
function exportData(){const blob=new Blob([JSON.stringify({events,intervalMinutes},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="la-mia-agenda-backup.json";a.click();URL.revokeObjectURL(a.href)}
function clearData(){if(confirm("Cancellare tutti gli appuntamenti e le note?")){localStorage.removeItem("agendaEvents");for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith("notes_"))localStorage.removeItem(k)}events={};render()}}
if(localStorage.getItem("agendaDark")==="1")document.body.classList.add("dark");render();
</script></body></html>
